# 把这个文件放到 VDS 的 nginx：
#   sudo cp chl.conf /etc/nginx/sites-available/chl.conf
#   sudo ln -s /etc/nginx/sites-available/chl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 配套：docker-compose 把后端发布在 127.0.0.1:8080、前端在 127.0.0.1:8081，
# 由这台 nginx 统一对外。前后端同源，无需 CORS。

upstream chl_backend  { server 127.0.0.1:8080; }
upstream chl_frontend { server 127.0.0.1:8081; }

server {
    listen 80;
    listen [::]:80;
    server_name _;            # 换成你的域名，如 pay.example.com

    # UPay 回调体限制是 1 MiB，这里给足
    client_max_body_size 2m;

    # ---- 后端 API ----
    # proxy_pass 不带 URI 路径 → 原样转发 /api/... 给后端（后端路由本身就在 /api 下）
    location /api/ {
        proxy_pass http://chl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # v0.0.2 回调验签依赖原始请求体，关闭可能改写 body 的处理
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # ---- 前端（容器内 nginx 提供静态文件，已含 SPA fallback）----
    location / {
        proxy_pass http://chl_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------------
# 启用 HTTPS：最简单用 certbot 自动改写本文件
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d pay.example.com
# certbot 会自动加 listen 443 ssl + 证书路径，并把 80 重定向到 443。
